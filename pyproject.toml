[project]
name = "cricketml"
version = "0.1.0"
description = "Machine learning fundamentals, taught and learnt through the game of cricket."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Kishan" }]
keywords = ["machine-learning", "cricket", "teaching", "data-science"]

dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "scipy>=1.13",
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "pyarrow>=16.0",
    "pyyaml>=6.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
notebooks = [
    "jupyterlab>=4.2",
    "ipykernel>=6.29",
    "ipywidgets>=8.1",
]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "nbstripout>=0.7",
    "pre-commit>=3.8",
]

[project.urls]
Repository = "https://github.com/kishan19/ds-with-cricket-basic-ML"

[project.scripts]
cricketml = "cricketml.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cricketml"]

# ---------------------------------------------------------------- tooling ---

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle + pyflakes
    "I",             # import sorting
    "UP",            # pyupgrade
    "B",             # bugbear
    "SIM",           # simplify
    "PD",            # pandas-vet
    "NPY",           # numpy
    "RUF",
]
ignore = [
    "E501",    # line length is handled by the formatter
]

[tool.ruff.lint.per-file-ignores]
# Notebooks import once at the top and use the names further down the lesson.
"lessons/**" = ["E402"]
"notebooks/**" = ["E402"]
# The template ships the standard import block ready to use; unused is the point.
"lessons/_template/**" = ["E402", "F401"]

[tool.ruff.format]
docstring-code-format = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "slow: marks tests that need the full ball-by-ball dataset",
]

[tool.mypy]
python_version = "3.11"
files = ["src"]
ignore_missing_imports = true
warn_unused_ignores = true
disallow_untyped_defs = false

[tool.coverage.run]
source = ["src/cricketml"]
