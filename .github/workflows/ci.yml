name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # Match [tool.mypy] python_version; on 3.12, numpy's stubs use syntax mypy rejects.
      UV_PYTHON: "3.11"
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install
        run: uv sync --all-extras

      - name: Lint
        run: uv run ruff check src tests lessons

      - name: Format check
        run: uv run ruff format --check src tests

      - name: Type check
        run: uv run mypy

      # Tests run on the small fixtures committed under tests/fixtures, so CI
      # never needs to download Cricsheet.
      - name: Test
        run: uv run pytest -m "not slow" --cov --cov-report=term-missing
